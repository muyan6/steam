[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
# 仅桌面端（Windows）构建：rlib 足够；cdylib/staticlib 为移动端专用，
# 且 windows-gnu 工具链下 cdylib 导出符号超过 GNU ld ordinal 上限会导致链接失败
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = { version = "2.1", default-features = false, features = ["fast"] }
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "cookies"] }
# 清单并发竞速需要 JoinSet；zip 源限流需要 sync::Semaphore。
# 二者都必须显式声明：仅靠 tauri/reqwest 间接启用的话，一旦上游调整 features
# 就会编译失败（Semaphore/JoinSet 分别受 sync / rt feature 门控）。
tokio = { version = "1", features = ["rt", "sync"] }
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_SystemInformation",
    # P2P：按可执行文件全路径枚举 / 结束本应用目录下的 openp2p 进程。
    # 用 ToolHelp 替代「每次起一个 PowerShell」——实测 spawn PowerShell 约 446ms，
    # 而退出路径与状态轮询都不该付这个代价。
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
notify = "6.1.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
