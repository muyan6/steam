version: '3.8'

services:
  steammaster-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: steammaster-backend
    restart: always
    ports:
      - "1257:1257"
    environment:
      - PORT=1257
      - NODE_ENV=production
      - ADMIN_SECRET=steammaster_admin_8888
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          # 密钥库+游戏库常驻 ~130-180MB，每日同步存在瞬时尖峰；300M 会把同步中的容器 OOM 杀掉
          memory: 512M
